<body data-page="art">
  <div class="topbar" id="topbar"></div>
  <header class="band" id="band"></header>

  <main class="wrap">
    <section class="section">
      <div class="section-label" id="countLabel">Art Gallery</div>
      <div class="filters" id="filters"></div>
      <div class="art-grid" id="artGrid"><div class="loading">Loading…</div></div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-top">
      <span id="lbCounter"></span>
      <button id="lbClose" aria-label="Close">&times;</button>
    </div>
    <div class="lightbox-body">
      <button class="lightbox-nav prev" id="lbPrev" aria-label="Previous">&lsaquo;</button>
      <div class="stage" id="lbStage"></div>
      <button class="lightbox-nav next" id="lbNext" aria-label="Next">&rsaquo;</button>
    </div>
    <div class="lightbox-caption">
      <h3 id="lbTitle"></h3>
      <p id="lbDesc"></p>
      <div class="tools" id="lbTools"></div>
    </div>
  </div>
