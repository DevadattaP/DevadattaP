<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Writing</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="blog">
  <div class="topbar" id="topbar"></div>
  <header class="band" id="band"></header>

  <main class="wrap">
    <section class="section" id="listSection">
      <div class="section-label">All posts</div>
      <ul class="row-list" id="postList"><div class="loading">Loading…</div></ul>
    </section>

    <section class="section" id="articleSection" style="display:none">
      <a class="back-link" href="blog.html">← All writing</a>
      <div class="article-meta" id="articleMeta"></div>
      <h1 id="articleTitle" style="font-size:28px; margin:0 0 22px; letter-spacing:-0.01em;"></h1>
      <div class="article" id="articleBody"></div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="js/app.js"></script>
  <script src="js/pages/blog.js"></script>
</body>
</html>
